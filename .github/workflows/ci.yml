name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # The corner-stone package embeds frontend/dist, so nothing here compiles
      # — not the tests, not the linter — until the bundle exists on disk.
      - uses: ./.github/actions/frontend-dist

      - name: Verify gofmt
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage gate (>= 80%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 80.0) { print "coverage below 80% threshold"; exit 1 } }'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

      # Слои: запросы в api.ts, загрузка в hooks/. Ни tsc, ни oxlint этого не
      # видят — для них скопированный в компонент useEffect совершенно легален.
      - name: Data-layer gate
        run: ./scripts/gates/web-data-layer.sh

      - name: Test
        working-directory: frontend
        run: npx vitest run

      # No "dist matches src" check follows any more, and nothing replaced it:
      # the bundle is no longer committed, so it cannot be stale. Every path that
      # produces a binary (image, release, this CI) builds it from src first.
      - name: Build
        working-directory: frontend
        run: npm run build

  # Возраст зависимостей. Отдельная джоба, а не шаг во frontend: ей нужна
  # полная история (база PR и коммит-фикстура для самопроверки), а остальным
  # джобам — нет.
  #
  # Только на pull_request: гейт спрашивает «что ветка ДОБАВЛЯЕТ в лок», и на
  # push в main этот вопрос бессмысленный — там уже всё добавлено.
  dep-age:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Сначала проверка проверки: гейт обязан падать на PR #194 — настоящем
      # обновлении, провёзшем две свежие версии, — и молчать на нём же неделей
      # позже. Без этого шага зелёный гейт не отличим от неработающего.
      - name: Gate self-test
        run: ./scripts/gates/dep-age.sh --self-test

      - name: Dependency age gate
        run: ./scripts/gates/dep-age.sh "${{ github.event.pull_request.base.sha }}"

  timezones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Крайние пояса, а не «пара разных»: вместе UTC+14 и UTC-11 покрывают
        # сутки целиком, поэтому в любой час хотя бы один из них видит дату,
        # отличную от UTC. Раннеры GitHub живут в UTC, и до этой джобы ни один
        # прогон движка не случался в зоне, где местный день другой.
        tz: ["Pacific/Kiritimati", "Pacific/Midway"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - uses: ./.github/actions/frontend-dist

      # Сначала проверка проверки: подсаживается настоящий дефект класса
      # v0.18.0 («сегодня» в UTC вместо местной зоны), и матрица обязана его
      # поймать, оставшись зелёной в UTC. Без этого шага «тесты прошли в
      # Pacific/Midway» не доказывает, что зона вообще влияла на результат.
      - name: Timezone matrix self-test
        run: ./scripts/gates/tz-matrix.sh --self-test

      - name: Test in ${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
        run: go test ./... -count=1

  changelog-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Гейт живёт в pre-push, то есть на машине разработчика, и до сих пор
      # никто не проверял, что его правило вообще работает. Самопроверка идёт
      # по настоящим коммитам истории и требует ОБЕИХ сторон: падать на PR
      # #223, где новая джоба CI прошла мимо журнала, и молчать на коммите,
      # трогающем только тесты.
      - name: Changelog scope gate self-test
        run: ./scripts/gates/changelog-scope.sh --self-test

      # Тот же довод, что у соседа: release-scope зовут руками при сборке
      # выпуска, поэтому его правило до сих пор никто не проверял. Самопроверка
      # идёт по настоящим диапазонам между тегами и требует обеих сторон —
      # покраснеть на v0.22.0..v0.23.0, где коммит b9bf3ab записи не оставил, и
      # промолчать на v0.18.0..v0.19.0, где её оставили все. Молчание при этом
      # обязано быть непустым: диапазон без поведенческих коммитов зелёный у
      # любого гейта, включая выключенный.
      - name: Release scope gate self-test
        run: ./scripts/gates/release-scope.sh --self-test

  ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Сначала проверка проверки: гейт обязан падать и на джобе, приехавшей в
      # CI мимо таблицы, и на записи, чья джоба из CI исчезла.
      - name: Gate self-test
        run: ./scripts/gates/ci-parity.sh --self-test

      - name: Local run covers CI
        run: ./scripts/gates/ci-parity.sh

  arch-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # H9 спрашивает у git последний коммит КОДА — мелкая копия отвечает
          # на этот вопрос неверно.
          fetch-depth: 0

      # Сначала проверка проверки: валидатор обязан ловить свои тринадцать
      # подсадок лжи, а гейт — падать на карте с якорем в никуда и молчать на
      # нетронутой. Без этого шага зелёный гейт не отличим от неработающего, а
      # именно так этот валидатор и прожил: написан, одиннадцать правил,
      # тринадцать подсадок — и ни одного вызывающего.
      - name: Gate self-test
        run: ./scripts/gates/arch-map.sh --self-test

      - name: Validate every architecture map
        run: ./scripts/gates/arch-map.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # govulncheck compiles the packages it analyses, so it needs the embedded
      # bundle on disk like any other Go build here.
      - uses: ./.github/actions/frontend-dist

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      - name: Scan for secrets with gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t kbengine:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kbengine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  # Infrastructure as code for the catalog bucket. Runs against LocalStack, so it
  # costs nothing and needs no AWS account — which is also the honest limit: the
  # API is emulated, the billing, quotas and IAM evaluation engine are not.
  terraform:
    runs-on: ubuntu-latest
    services:
      localstack:
        # 4.14, not latest: the 2026.x line exits with code 55 unless a licence
        # token is supplied. A `latest` that silently became paid is exactly why
        # images are pinned here.
        image: localstack/localstack:4.14
        ports:
          - 4566:4566
        env:
          SERVICES: s3,iam,sts
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TF_VAR_localstack_endpoint: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

      - name: Format and validate (OpenTofu)
        working-directory: deploy/terraform
        run: |
          tofu fmt -check -diff
          tofu init -backend=false -input=false
          tofu validate

      # The bundled ruleset knows HCL; the AWS plugin knows what a valid S3 or
      # IAM block looks like. tflint exits 2 on findings, so a green step here
      # means it actually had nothing to say.
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: deploy/terraform
        run: |
          tflint --init
          tflint --format=compact
          tflint --chdir=bootstrap --init
          tflint --chdir=bootstrap --format=compact

      # State in a bucket instead of on one laptop, checked the whole way: the
      # bootstrap module creates the bucket, the main module keeps its state
      # there, and a planted lock must stop a second run.
      - name: Remote state, end to end
        run: |
          cd deploy/terraform/bootstrap
          tofu init -input=false
          tofu apply -input=false -auto-approve
          cd ..

          # A separate state dir: the earlier local-state apply in this job still
          # owns ./terraform.tfstate, and reinitialising over it would ask about
          # migration.
          rm -rf .terraform terraform.tfstate*
          tofu init -input=false \
            -backend-config=bucket=kbengine-tfstate \
            -backend-config=key=catalog/terraform.tfstate \
            -backend-config=region=eu-central-1 \
            -backend-config=endpoints='{s3="http://localhost:4566"}' \
            -backend-config=use_lockfile=true \
            -backend-config=access_key=test \
            -backend-config=secret_key=test \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true
          tofu apply -input=false -auto-approve

          # The point of remote state: nothing local is left holding it.
          test ! -f terraform.tfstate
          aws --endpoint-url=http://localhost:4566 s3api head-object \
            --bucket kbengine-tfstate --key catalog/terraform.tfstate \
            --query ContentLength --output text

          # Locking, proven by planting someone else's lock: the next run must
          # refuse. A lock nobody has seen refuse is not a lock.
          echo "held by another run" > lock.txt
          aws --endpoint-url=http://localhost:4566 s3 cp lock.txt \
            s3://kbengine-tfstate/catalog/terraform.tfstate.tflock
          if tofu apply -input=false -auto-approve -lock-timeout=5s; then
            echo "the run proceeded while the state was locked"
            exit 1
          fi
          echo "locked state correctly refused a second run"

      # Asking the tool that wrote the resources whether they exist is a closed
      # loop. The AWS CLI is a separate client and answers independently.
      - name: Verify with the AWS CLI, not with OpenTofu
        run: |
          E="--endpoint-url=http://localhost:4566"

          test "$(aws $E s3api get-bucket-versioning --bucket kbengine-catalog --query Status --output text)" = "Enabled"
          test "$(aws $E s3api get-public-access-block --bucket kbengine-catalog --query PublicAccessBlockConfiguration.BlockPublicAcls --output text)" = "True"
          test "$(aws $E iam list-attached-role-policies --role-name kbengine-engine --query 'AttachedPolicies[0].PolicyName' --output text)" = "kbengine-catalog-read"

          # Control in the same run: a bucket nobody created must not answer.
          if aws $E s3api head-bucket --bucket kbengine-not-created 2>/dev/null; then
            echo "an invented bucket answered — this probe cannot tell resources apart"
            exit 1
          fi
          echo "invented bucket correctly absent"

      # The reason this module exists, checked rather than argued: the live
      # catalog is 1 807 283 bytes and a ConfigMap tops out at 1 048 576. The
      # object below is that size, with invented content — real catalogs stay out
      # of CI.
      - name: A catalog-sized object fits where a ConfigMap would not
        run: |
          python3 - <<'PY'
          import json
          entries, target = [], 1807283
          while len(json.dumps({"entries": entries})) < target:
              n = len(entries)
              entries.append({"id": n, "title": f"Synthetic entry {n}", "notes": "x" * 40})
          open("big-catalog.json", "w").write(json.dumps({"meta": {"categories": {"demo": "Demo"}}, "entries": entries}))
          PY
          size=$(stat -c%s big-catalog.json)
          echo "object: $size bytes, ConfigMap ceiling: 1048576"
          test "$size" -gt 1048576

          aws --endpoint-url=http://localhost:4566 s3 cp big-catalog.json s3://kbengine-catalog/catalog.json
          stored=$(aws --endpoint-url=http://localhost:4566 s3api head-object --bucket kbengine-catalog --key catalog.json --query ContentLength --output text)
          test "$stored" = "$size"
          echo "stored $stored bytes — a size the ConfigMap path cannot carry"

      # "Works with both tools" is a claim, so it gets measured. Terraform is
      # BUSL-licensed and only runs here, in a throwaway job; the repository's own
      # path is OpenTofu.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Same HCL under Terraform
        working-directory: deploy/terraform
        run: |
          # A clean slate, not just a fresh lock. Two things do not survive the
          # crossing, and the second one only showed up on a real run:
          #   - the lock names registry.opentofu.org, Terraform expects
          #     registry.terraform.io;
          #   - .terraform/ carries the backend config OpenTofu wrote, and
          #     Terraform rejects it outright ("unsupported attribute
          #     assume_role_duration_seconds").
          rm -rf .terraform .terraform.lock.hcl
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

  # Deploys the image built from this branch into a throwaway cluster and reads a
  # real route out of it. Scope is stated in deploy/k8s/README.md: kind on one
  # node says nothing about production traffic, and the Ingress and HPA are out
  # of the applied set because this cluster has neither a controller nor
  # metrics-server.
  k8s:
    runs-on: ubuntu-latest
    env:
      CLUSTER: kbengine-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t kbengine:ci .

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER }}

      # The cluster pulls by name, and `kbengine:ci` exists only in the runner's
      # docker daemon. Without this the pod sits in ImagePullBackOff.
      - name: Load image into the cluster
        run: kind load docker-image kbengine:ci --name "$CLUSTER"

      - name: Apply manifests
        run: |
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl rollout status deployment/kbengine --timeout=180s

      # Readiness already passed by this point, so the catalog parsed. What is
      # still unproven is that the Service actually reaches the container, which
      # is why this reads a route rather than trusting the rollout.
      - name: Read a real route through the Service
        run: |
          kubectl port-forward svc/kbengine 8080:80 &
          for _ in $(seq 1 30); do
            curl -sf localhost:8080/healthz >/dev/null && break
            sleep 1
          done

          echo "--- /readyz ---"
          curl -sf localhost:8080/readyz

          # By body, not by status code. The server answers 200 on any unknown
          # path outside /api/ because a SPA fallback serves index.html, so
          # "200" on its own is not evidence that anything worked.
          echo "--- /api/stats ---"
          body=$(curl -sf localhost:8080/api/stats)
          echo "$body"
          echo "$body" | grep -q '"total":1' || {
            echo "the API answered, but not with the catalog this deployment mounts"
            exit 1
          }

          # Control in the same run: a path that does not exist must 404. If it
          # does not, the check above was reading a fallback and means nothing.
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/nosuchroute)
          echo "invented path: HTTP $code"
          [ "$code" = "404" ] || {
            echo "an invented API path answered $code — this probe cannot tell routes apart"
            exit 1
          }

      # The chart is a second description of the same deployment, and such pairs
      # drift silently: someone edits a probe in one place and never learns about
      # the other. Installing it here means drift surfaces while both are running.
      - name: Install the Helm chart alongside
        run: |
          helm lint deploy/helm/kbengine
          kubectl create namespace helm
          helm install kbengine deploy/helm/kbengine -n helm \
            --set image.repository=kbengine \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --wait --timeout 180s

      # Compares the objects that reached the cluster, not the template text: the
      # text differs by design, the pod spec must not. Self-test runs first — a
      # gate that has never gone red is indistinguishable from one doing nothing.
      - name: Deploy parity gate
        run: |
          ./scripts/gates/deploy-parity.sh --self-test
          ./scripts/gates/deploy-parity.sh default/kbengine helm/kbengine

      # The whole reason deploy/terraform exists, end to end: a catalog too big
      # for a ConfigMap goes into object storage, an init container fetches it,
      # and the engine serves it. MinIO stands in for S3 — same API, no account.
      - name: Catalog delivered from object storage
        run: |
          kubectl apply -f deploy/k8s/test/minio.yaml
          kubectl rollout status deployment/minio --timeout=180s

          # 1.72 MiB of invented entries — the size of the real catalog, none of
          # its content. ids start at 1: the engine rejects id=0, and a fixture
          # that trips validation would hide whatever it was meant to prove.
          python3 - <<'PY'
          import json
          entries = []
          while len(json.dumps({"entries": entries})) < 1807283:
              n = len(entries) + 1
              entries.append({"id": n, "title": f"Synthetic entry {n}", "type": "article",
                              "category": "demo", "description": "x" * 30,
                              "url": f"https://example.com/{n}", "tags": ["demo"],
                              "status": "active", "lifecycle": "active", "notes": ""})
          json.dump({"meta": {"categories": {"demo": "Demo"}, "tag_labels": {"demo": "Demo"}},
                     "entries": entries}, open("big-catalog.json", "w"))
          print(f"entries: {len(entries)}")
          PY
          expected=$(python3 -c "import json; print(len(json.load(open('big-catalog.json'))['entries']))")
          size=$(stat -c%s big-catalog.json)
          echo "catalog: $size bytes, $expected entries (ConfigMap ceiling: 1048576)"
          test "$size" -gt 1048576

          kubectl port-forward svc/minio 9000:9000 &
          for _ in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && break; sleep 1; done

          curl -sSfL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc && chmod +x mc
          ./mc alias set m http://localhost:9000 minioadmin minioadmin
          ./mc mb m/kbengine-catalog
          ./mc cp big-catalog.json m/kbengine-catalog/catalog.json

          kubectl create namespace s3
          kubectl get secret s3-credentials -o yaml | sed 's/namespace: default/namespace: s3/' | kubectl apply -n s3 -f -

          helm install from-s3 deploy/helm/kbengine -n s3 \
            --set image.repository=kbengine --set image.tag=ci --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set catalog.source=s3 \
            --set catalog.s3.endpoint=http://minio.default.svc.cluster.local:9000 \
            --set catalog.s3.credentialsSecret=s3-credentials \
            --wait --timeout 240s

          # The init container's own words, not just the pod being green.
          kubectl logs -n s3 -l app.kubernetes.io/name=kbengine -c fetch-catalog --tail=3

          # Not svc/from-s3: the chart's fullname helper appends the chart name
          # unless the release already carries it, so the object is
          # "from-s3-kbengine". Asking the cluster beats spelling it out.
          svc=$(kubectl get svc -n s3 -l app.kubernetes.io/instance=from-s3 -o name | head -1)
          echo "service: $svc"
          kubectl port-forward -n s3 "$svc" 8098:80 &
          for _ in $(seq 1 30); do curl -sf localhost:8098/healthz >/dev/null && break; sleep 1; done

          # By count, not by "it answered": the engine must be serving the object
          # that came out of the bucket, entry for entry.
          got=$(curl -sf localhost:8098/api/stats | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          echo "engine reports $got entries, object had $expected"
          test "$got" = "$expected"

      # Metrics are only useful if something collects them. This puts Prometheus
      # in the cluster and checks it discovers the engine on its own — no
      # addresses written down anywhere — and that a value actually arrives.
      - name: Prometheus discovers the engine and collects
        run: |
          kubectl apply -f deploy/k8s/observability/prometheus.yaml
          kubectl rollout status deployment/prometheus --timeout=240s

          kubectl port-forward svc/prometheus 9090:9090 &
          for _ in $(seq 1 40); do curl -sf localhost:9090/-/ready >/dev/null && break; sleep 2; done

          # Discovery is not instant: the target appears, then gets scraped.
          # By this point the S3 step has put a SECOND engine in the cluster, so
          # there is more than one target and "the first one" is whichever order
          # the API happened to return. Every active target must be up — that is
          # both stronger and deterministic.
          for _ in $(seq 1 20); do
            state=$(curl -sf "localhost:9090/api/v1/targets?state=active" \
              | python3 -c "import json,sys; t=json.load(sys.stdin)['data']['activeTargets']; print('none' if not t else ('up' if all(x['health']=='up' for x in t) else 'down'))")
            [ "$state" = "up" ] && break
            sleep 3
          done
          echo "target health (all active targets): $state"
          test "$state" = "up"

          # A live target proves the scrape happened; this proves the value made
          # it into storage and can be read back out.
          #
          # Named by namespace on purpose. THREE engines are running by now:
          # this one in default with the demo catalog of a single entry, the
          # chart's in helm, and the S3 one with 7421 synthetic entries. Asking
          # for the bare metric returns whichever series came first — the check
          # then passes or fails by luck, and it did both before anyone noticed.
          # The pod name does not separate them either: the chart's release is
          # also called kbengine, so its pods are kbengine-* as well. Namespace
          # is the only label that tells the three apart, which is why the scrape
          # config now exports it.
          entries=$(curl -sf --get "localhost:9090/api/v1/query" \
            --data-urlencode 'query=kbengine_catalog_entries{namespace="default"}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['data']['result']; print(r[0]['value'][1] if len(r)==1 else f'{len(r)} series')")
          echo "kbengine_catalog_entries through Prometheus: $entries"
          test "$entries" = "1"

          # Control in the same run: a metric nobody exports must come back
          # empty. Otherwise the query above proves only that the API answers.
          absent=$(curl -sf "localhost:9090/api/v1/query?query=kbengine_invented_metric" \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)['data']['result']))")
          echo "invented metric series: $absent"
          test "$absent" = "0"

      # A green run that has never been shown to go red is not evidence. This
      # feeds the pod a catalog the engine cannot parse — the exact defect hit
      # while writing these manifests — and requires the rollout to fail.
      - name: Negative control — readiness broken on purpose
        run: |
          kubectl create namespace negative
          kubectl apply -k deploy/k8s/overlays/ci-negative -n negative

          if kubectl rollout status deployment/kbengine -n negative --timeout=90s; then
            echo "negative control did not fire: the rollout completed with an unparseable catalog"
            exit 1
          fi

          echo "negative control fired: the rollout did not complete, as required"
          kubectl get pods -n negative
          # The reason must be readable at the endpoint rather than inferred from
          # a crash loop — that is the whole point of splitting the two probes.
          pod=$(kubectl get pod -n negative -l app.kubernetes.io/name=kbengine -o name | head -1)
          kubectl describe "$pod" -n negative | grep -B1 -A3 "Readiness probe failed" || true
