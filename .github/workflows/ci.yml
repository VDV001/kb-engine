name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # The corner-stone package embeds frontend/dist, so nothing here compiles
      # — not the tests, not the linter — until the bundle exists on disk.
      - uses: ./.github/actions/frontend-dist

      - name: Verify gofmt
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage gate (>= 80%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 80.0) { print "coverage below 80% threshold"; exit 1 } }'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

      # Слои: запросы в api.ts, загрузка в hooks/. Ни tsc, ни oxlint этого не
      # видят — для них скопированный в компонент useEffect совершенно легален.
      - name: Data-layer gate
        run: ./scripts/gates/web-data-layer.sh

      - name: Test
        working-directory: frontend
        run: npx vitest run

      # No "dist matches src" check follows any more, and nothing replaced it:
      # the bundle is no longer committed, so it cannot be stale. Every path that
      # produces a binary (image, release, this CI) builds it from src first.
      - name: Build
        working-directory: frontend
        run: npm run build

  # Возраст зависимостей. Отдельная джоба, а не шаг во frontend: ей нужна
  # полная история (база PR и коммит-фикстура для самопроверки), а остальным
  # джобам — нет.
  #
  # Только на pull_request: гейт спрашивает «что ветка ДОБАВЛЯЕТ в лок», и на
  # push в main этот вопрос бессмысленный — там уже всё добавлено.
  dep-age:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Сначала проверка проверки: гейт обязан падать на PR #194 — настоящем
      # обновлении, провёзшем две свежие версии, — и молчать на нём же неделей
      # позже. Без этого шага зелёный гейт не отличим от неработающего.
      - name: Gate self-test
        run: ./scripts/gates/dep-age.sh --self-test

      - name: Dependency age gate
        run: ./scripts/gates/dep-age.sh "${{ github.event.pull_request.base.sha }}"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # govulncheck compiles the packages it analyses, so it needs the embedded
      # bundle on disk like any other Go build here.
      - uses: ./.github/actions/frontend-dist

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      - name: Scan for secrets with gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t kbengine:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kbengine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  # Deploys the image built from this branch into a throwaway cluster and reads a
  # real route out of it. Scope is stated in deploy/k8s/README.md: kind on one
  # node says nothing about production traffic, and the Ingress and HPA are out
  # of the applied set because this cluster has neither a controller nor
  # metrics-server.
  k8s:
    runs-on: ubuntu-latest
    env:
      CLUSTER: kbengine-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t kbengine:ci .

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER }}

      # The cluster pulls by name, and `kbengine:ci` exists only in the runner's
      # docker daemon. Without this the pod sits in ImagePullBackOff.
      - name: Load image into the cluster
        run: kind load docker-image kbengine:ci --name "$CLUSTER"

      - name: Apply manifests
        run: |
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl rollout status deployment/kbengine --timeout=180s

      # Readiness already passed by this point, so the catalog parsed. What is
      # still unproven is that the Service actually reaches the container, which
      # is why this reads a route rather than trusting the rollout.
      - name: Read a real route through the Service
        run: |
          kubectl port-forward svc/kbengine 8080:80 &
          for _ in $(seq 1 30); do
            curl -sf localhost:8080/healthz >/dev/null && break
            sleep 1
          done

          echo "--- /readyz ---"
          curl -sf localhost:8080/readyz

          # By body, not by status code. The server answers 200 on any unknown
          # path outside /api/ because a SPA fallback serves index.html, so
          # "200" on its own is not evidence that anything worked.
          echo "--- /api/stats ---"
          body=$(curl -sf localhost:8080/api/stats)
          echo "$body"
          echo "$body" | grep -q '"total":1' || {
            echo "the API answered, but not with the catalog this deployment mounts"
            exit 1
          }

          # Control in the same run: a path that does not exist must 404. If it
          # does not, the check above was reading a fallback and means nothing.
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/nosuchroute)
          echo "invented path: HTTP $code"
          [ "$code" = "404" ] || {
            echo "an invented API path answered $code — this probe cannot tell routes apart"
            exit 1
          }

      # The chart is a second description of the same deployment, and such pairs
      # drift silently: someone edits a probe in one place and never learns about
      # the other. Installing it here means drift surfaces while both are running.
      - name: Install the Helm chart alongside
        run: |
          helm lint deploy/helm/kbengine
          kubectl create namespace helm
          helm install kbengine deploy/helm/kbengine -n helm \
            --set image.repository=kbengine \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --wait --timeout 180s

      # Compares the objects that reached the cluster, not the template text: the
      # text differs by design, the pod spec must not. Self-test runs first — a
      # gate that has never gone red is indistinguishable from one doing nothing.
      - name: Deploy parity gate
        run: |
          ./scripts/gates/deploy-parity.sh --self-test
          ./scripts/gates/deploy-parity.sh default/kbengine helm/kbengine

      # A green run that has never been shown to go red is not evidence. This
      # feeds the pod a catalog the engine cannot parse — the exact defect hit
      # while writing these manifests — and requires the rollout to fail.
      - name: Negative control — readiness broken on purpose
        run: |
          kubectl create namespace negative
          kubectl apply -k deploy/k8s/overlays/ci-negative -n negative

          if kubectl rollout status deployment/kbengine -n negative --timeout=90s; then
            echo "negative control did not fire: the rollout completed with an unparseable catalog"
            exit 1
          fi

          echo "negative control fired: the rollout did not complete, as required"
          kubectl get pods -n negative
          # The reason must be readable at the endpoint rather than inferred from
          # a crash loop — that is the whole point of splitting the two probes.
          pod=$(kubectl get pod -n negative -l app.kubernetes.io/name=kbengine -o name | head -1)
          kubectl describe "$pod" -n negative | grep -B1 -A3 "Readiness probe failed" || true
