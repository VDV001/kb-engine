name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-approve and auto-merge only low-risk patch/minor bumps once CI is
      # green. Major bumps are left for manual review.
      #
      # The approval needs a token that is not GITHUB_TOKEN: GitHub refuses
      # `addPullRequestReview` from Actions outright ("GitHub Actions is not
      # permitted to approve pull requests"), and main requires one approving
      # review, so with the built-in token this step could only ever fail.
      #
      # Состояний три, а не два, и третье стоило красных прогонов.
      #
      # Нет токена — шаг говорит об этом и включает auto-merge. Токен есть и
      # права у него есть — ревью ставится, и на зелёном CI обновление уезжает
      # само. А вот токен есть, но прав на `addPullRequestReview` у него нет:
      # `gh pr review` падает, `set -e` обрывает шаг, и до `gh pr merge --auto`
      # дело не доходит вовсе. Прогон красный, auto-merge не включён, PR висит.
      # Именно так вышло с #194 и #195: «Resource not accessible by personal
      # access token».
      #
      # Поэтому неудача ревью — предупреждение, а не приговор: auto-merge
      # включается в любом случае, а причина называется вслух. Красный крест на
      # каждом обновлении зависимостей приучает не смотреть на красное, и это
      # дороже, чем сама автоматика.
      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          if [ -n "$APPROVAL_TOKEN" ]; then
            if ! GH_TOKEN="$APPROVAL_TOKEN" gh pr review --approve "$PR_URL"; then
              echo "::warning title=Approval rejected::DEPENDABOT_PAT не смог поставить ревью — токену нужны права Pull requests: write на этот репозиторий. Auto-merge включён, но PR ждёт живого ревью."
            fi
          else
            echo "::notice title=No approval token::DEPENDABOT_PAT is not set — enabling auto-merge only; this PR waits for a review before it lands."
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
