name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-approve and auto-merge only low-risk patch/minor bumps once CI is
      # green. Major bumps are left for manual review.
      #
      # The approval needs a token that is not GITHUB_TOKEN: GitHub refuses
      # `addPullRequestReview` from Actions outright ("GitHub Actions is not
      # permitted to approve pull requests"), and main requires one approving
      # review, so with the built-in token this step could only ever fail.
      #
      # Absent DEPENDABOT_PAT the step does not fail — it enables auto-merge and
      # says what is missing. That keeps the run honest in both states: with the
      # secret the bump lands on green CI, without it the PR waits for a human
      # review and then merges itself. A red X on every dependency bump teaches
      # people to ignore red, which costs more than the automation is worth.
      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          if [ -n "$APPROVAL_TOKEN" ]; then
            GH_TOKEN="$APPROVAL_TOKEN" gh pr review --approve "$PR_URL"
          else
            echo "::notice title=No approval token::DEPENDABOT_PAT is not set — enabling auto-merge only; this PR waits for a review before it lands."
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
