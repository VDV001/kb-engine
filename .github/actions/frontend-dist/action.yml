name: Build frontend bundle
description: >
  Builds frontend/dist. The bundle is a build artifact and is not committed, so
  every job that compiles Go needs it first — go:embed reads it from disk at
  compile time and the build fails without it.

runs:
  using: composite
  steps:
    # Same Node version as the frontend job; it lives here because this is the
    # only place the bundle is built for Go jobs.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend deps
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Build bundle
      shell: bash
      working-directory: frontend
      run: npm run build
