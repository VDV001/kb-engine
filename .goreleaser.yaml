version: 2
project_name: kbengine

before:
  hooks:
    - go mod tidy

builds:
  - id: kbengine
    main: ./cmd/kbengine
    binary: kbengine
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc

release:
  github:
    owner: VDV001
    name: kb-engine
