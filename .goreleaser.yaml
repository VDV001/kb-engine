version: 2
project_name: kbengine

# The dashboard bundle is a build artifact and is not in the repository, so the
# release builds it before Go compiles. go:embed reads frontend/dist from disk at
# compile time: without these hooks the build fails outright, which is the point
# — a release must not be able to quietly ship a binary with no dashboard.
# Plain string hooks on purpose: the `cmd:`/`dir:` form is a Pro feature for
# global hooks, and this repository releases with the OSS build. `--prefix` does
# the same job — npm runs the script with frontend/ as its working directory.
before:
  hooks:
    - go mod tidy
    - npm --prefix frontend ci
    - npm --prefix frontend run build

builds:
  - id: kbengine
    main: ./cmd/kbengine
    binary: kbengine
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

  # MCP-сервер отдельным бинарём, но в тех же архивах: число активов релиза не
  # меняется, а агент получает сервер вместе с движком. Порознь они разъехались
  # бы по версиям, и «поиск отвечает по-разному» стало бы вопросом без ответа.
  - id: kbengine-mcp
    main: ./cmd/kbengine-mcp
    binary: kbengine-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc

release:
  github:
    owner: VDV001
    name: kb-engine
