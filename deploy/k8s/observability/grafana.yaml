# Grafana with its data source and dashboard provisioned from files.
#
# Dashboards drawn by hand in the UI live in one installation's database and
# disappear with it: nobody can review them, and recreating one means
# remembering what it looked like. These are ConfigMaps, so the dashboard is
# code — diffable, reviewable, and identical in every cluster it lands in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: kbengine
        folder: kb-engine
        type: file
        # Editing in the UI is allowed, saving over the file is not: otherwise
        # the copy on screen quietly stops matching the copy in git.
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kbengine
data:
  kbengine.json: |
    {
      "title": "kb-engine",
      "uid": "kbengine",
      "tags": ["kb-engine"],
      "timezone": "browser",
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "5s",
      "panels": [
        {
          "type": "stat",
          "title": "Записей в каталоге",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "kbengine_catalog_entries", "legendFormat": "записей" }
          ]
        },
        {
          "type": "stat",
          "title": "Не читаются",
          "description": "Записи есть в каталоге, но не проходят проверку. Движок с ними поднимается — увидеть их иначе можно только глядя на /readyz в нужный момент.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "kbengine_catalog_unreadable_entries", "legendFormat": "негодных" }
          ]
        },
        {
          "type": "stat",
          "title": "Каталог читается",
          "description": "Ноль означает, что каталог не прочитался целиком. Отдельная метрика нужна потому, что пропавший ряд на графике выглядит как «сервис умер», а это другой диагноз.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            { "expr": "kbengine_catalog_readable", "legendFormat": "читается" }
          ]
        },
        {
          "type": "stat",
          "title": "Версия сборки",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "options": { "textMode": "name" },
          "targets": [
            { "expr": "kbengine_build_info", "legendFormat": "{{version}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Запросы в секунду по маршрутам",
          "description": "R из RED. Метка — шаблон маршрута, а не путь: иначе каждый /api/maps/<id> завёл бы свой ряд.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum by (route) (rate(kbengine_http_requests_total[1m]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Ошибки в секунду",
          "description": "E из RED. Пусто — это хорошо: значит четырёхсотых и пятисотых не было.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum by (route, code) (rate(kbengine_http_requests_total{code!~\"2..\"}[1m]))",
              "legendFormat": "{{route}} {{code}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Задержка, 95-й процентиль",
          "description": "D из RED. Считается по корзинам гистограммы, поэтому точность ограничена их границами — это свойство метода, а не сбой.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (route, le) (rate(kbengine_http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "{{route}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.1.3
          env:
            # ⚠️ ANONYMOUS ADMIN. NOT FOR ANY CLUSTER THAT OUTLIVES A CHECK.
            #
            # Safe here for reasons that all stop being true elsewhere: the
            # cluster is thrown away in minutes, Grafana stores nothing (the
            # dashboard comes from a file, the data from a 2h Prometheus), and
            # it is reachable only through `kubectl port-forward` to a laptop —
            # there is no Ingress and no Service outside the cluster.
            #
            # Anywhere else this is a hole: anyone reaching the port becomes an
            # admin, can repoint data sources and read whatever Grafana can.
            # Before using this file for real, delete these three variables and
            # set GF_SECURITY_ADMIN_PASSWORD from a Secret — or better, wire up
            # SSO, because local Grafana accounts are the ones nobody revokes.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-kbengine
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
