apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbengine.fullname" . }}
  labels:
    {{- include "kbengine.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kbengine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kbengine.selectorLabels" . | nindent 8 }}
      {{- if and (eq .Values.catalog.source "configMap") (not .Values.catalog.existingConfigMap) }}
      annotations:
        # Editing the catalog changes the ConfigMap, and a ConfigMap change alone
        # does not restart anything — the pod would keep serving the old data
        # until something unrelated happened to roll it. Hashing the content into
        # an annotation makes the edit itself the trigger.
        checksum/catalog: {{ .Values.catalog.json | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.catalog.source "s3" }}
      # The engine reads a file path and has no S3 client, so the object is
      # fetched once, before the engine starts, into a volume both containers
      # share. Failing here fails the pod: better than serving an empty catalog.
      initContainers:
        - name: fetch-catalog
          image: "{{ .Values.catalog.s3.image.repository }}:{{ .Values.catalog.s3.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -e
              # --config-dir into a writable volume: the container runs with a
              # read-only root filesystem, and mc's first act is to write its
              # own config. Without this it dies on mkdir /.mc before touching S3.
              mc --config-dir /tmp/mc alias set src \
                "${S3_ENDPOINT:-https://s3.${AWS_REGION:-us-east-1}.amazonaws.com}" \
                "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" {{ if .Values.catalog.s3.insecure }}--insecure{{ end }}
              mc --config-dir /tmp/mc cp src/{{ .Values.catalog.s3.bucket }}/{{ .Values.catalog.s3.key }} /data/catalog.json
              # An empty or truncated download would let the engine start and
              # answer /readyz 503 forever with nobody knowing why.
              test -s /data/catalog.json
              echo "catalog fetched: $(wc -c < /data/catalog.json) bytes"
          env:
            - name: S3_ENDPOINT
              value: {{ .Values.catalog.s3.endpoint | quote }}
            {{- if .Values.catalog.s3.credentialsSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.s3.credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.s3.credentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: catalog
              mountPath: /data
            - name: mc-config
              mountPath: /tmp
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --catalog=/data/catalog.json
            # The binary binds 127.0.0.1 by default, which inside a container
            # means the Service reaches nothing. Widening the bind is a choice
            # someone makes, so it is written out rather than defaulted.
            - --addr=:8080
          ports:
            - name: http
              containerPort: 8080
          # Two probes because the process and the data fail separately.
          #
          # /healthz — the process answers. Restarting helps, so it drives liveness.
          # /readyz  — the catalog parsed. Restarting does NOT help: a broken
          #            catalog comes back broken. The pod leaves the Service and
          #            keeps running, so the reason stays readable at the endpoint
          #            instead of hiding inside a crash loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: catalog
              mountPath: /data
              readOnly: true
      volumes:
        {{- if eq .Values.catalog.source "s3" }}
        # Scratch space for the fetcher's own config. Separate from the catalog
        # volume so the engine's mount stays read-only.
        - name: mc-config
          emptyDir: {}
        {{- end }}
        - name: catalog
          {{- if eq .Values.catalog.source "s3" }}
          # Written by the init container, read by the engine. Lives and dies
          # with the pod, so a restart re-fetches — which is also how a catalog
          # update reaches a running deployment: roll the pods.
          emptyDir: {}
          {{- else }}
          configMap:
            name: {{ include "kbengine.catalogConfigMap" . }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
