<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Иконка kb в языке daniilvdovin.com: черный лист с сеткой точек и мозг
       контуром спектра сайта (#e8b84a … #8fc79a): слева человеческое полушарие
       с извилинами, справа машинное с буквами DVK (Daniil Vdovin Knowledge). Знак в шапке окна —
       тот же мозг заливкой (desktop/frontend/index.html).
       Форма плитки — сетка иконок macOS (824 со скруглением 185, отступ 100). -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <pattern id="dots" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="3.2" fill="#808084" fill-opacity="0.38"/>
    </pattern>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="60" y2="0"><stop offset="0" stop-color="#e8b84a"/><stop offset=".22" stop-color="#e8925a"/><stop offset=".42" stop-color="#e07070"/><stop offset=".6" stop-color="#5e8fd0"/><stop offset=".8" stop-color="#5fb0d8"/><stop offset="1" stop-color="#8fc79a"/></linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheet)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#232326" stroke-width="4"/>

  <!-- мозг 64×64, вписан в плитку: ширина 4.5…58 → 594 px, центр 512 -->
  <g transform="translate(168 182) scale(11)">
    <g fill="none" stroke="url(#spec)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 10C27 6.5 21 6.5 18 10C12.5 9 8.5 13.5 9.5 18.5C5.5 21 4.5 26.5 7.5 30.5C4.5 34.5 5.5 40.5 10 42.5C10.5 47.5 15.5 51.5 20.5 50C23.5 54 29 54 31 51Z" stroke-width="3"/><path d="M33 10H40L46 12.5H50L54.5 18V23.5L58 28.5V35.5L55 40V44.5L50 49.5H44L38.5 52.5H33Z" stroke-width="3"/>
      <path d="M24 14C20 15.5 19.5 20 23 22.5M13.5 22C18 22 20.5 26.5 17 29.5M11.5 35.5C16 33 21 35 21 39.5M27 26.5C22.5 28.5 23 33.5 27.5 34.5M17.5 45.5C20.5 42 26 42.5 27.5 46" stroke-width="2.4"/><path transform="translate(8.6 4.4) scale(.8)" d="M37 13H41C45 13 47.5 15.5 47.5 18.5C47.5 21.5 45 24 41 24H37ZM36.5 28 41.75 38 47 28M37.5 42V51M37.5 47 44 42M40 45.5 45.5 51" stroke-width="3.2"/>
    </g>
  </g>
</svg>
