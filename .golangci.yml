version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - misspell
    - unconvert
    - errorlint
    - bodyclose
    - modernize

  settings:
    gocyclo:
      min-complexity: 12
    errcheck:
      # Writes to stdout/stderr in a CLI are not meaningfully recoverable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Tests may use longer functions and table-driven helpers.
      - path: '(.+_test\.go)'
        linters:
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
