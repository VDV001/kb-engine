version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - misspell
    - unconvert
    - errorlint
    - bodyclose

  settings:
    gocyclo:
      min-complexity: 12
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Tests may use longer functions and table-driven helpers.
      - path: '(.+_test\.go)'
        linters:
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
