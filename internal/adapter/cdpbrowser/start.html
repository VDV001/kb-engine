<style>
/* Стартовая страница браузера DVK: мозг как солнце, планеты разделов на орбитах, звезды. Тема одна, темная. */
:root { --fg: #e6e6e6; --muted: #9a9a9c; --faint: #808084; --accent-hi: #8fb2e3; --wash: #5e8fd024; --win: #07070a; --star: 235, 240, 255; --glass: 12, 12, 16;

  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--win); color: var(--fg); font: 14px/1.5 var(--sans); }
.page { position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px; background: var(--win); }
.page > * { position: relative; z-index: 2; }
.page > canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; color: var(--faint); }
/* солнце: мозг */
.sun { position: relative; width: 150px; height: 150px; display: grid; place-items: center; margin-top: -6px; }
.brain { width: 128px; height: 128px; overflow: visible; filter: drop-shadow(0 0 14px rgba(94, 143, 208, .5)); }
.lobe-l, .lobe-r { transition: transform .5s cubic-bezier(.16, 1, .3, 1); }
.sun:hover .lobe-l, .page:focus-within .lobe-l { transform: translateX(-3px); } .sun:hover .lobe-r, .page:focus-within .lobe-r { transform: translateX(3px); }
.cut { fill: none; stroke: var(--win); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; } .cutf { fill: var(--win); }
.cutf circle { animation: padb 1.5s ease-in-out infinite; } .cutf circle:nth-child(2) { animation-delay: .25s !important; } .cutf circle:nth-child(3) { animation-delay: .5s !important; } .cutf circle:nth-child(4) { animation-delay: .75s !important; }
.typing .gyri { stroke-dasharray: 5 3.5; animation: march 1.1s linear infinite; }
@keyframes padb { 50% { opacity: .15; } } @keyframes march { to { stroke-dashoffset: -17; } }
.hi { font-size: 14px; color: var(--muted); margin-top: -2px; }
.word { font: 700 46px/1.05 var(--sans); letter-spacing: -.035em; background: linear-gradient(100deg, var(--s1), var(--s2), var(--s3), var(--s4), var(--s5), var(--s6), var(--s1)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: flow 8s linear infinite; margin-top: -2px; }
@keyframes flow { to { background-position: 150% 0; } }
.q { position: relative; display: flex; align-items: center; gap: 10px; width: min(560px, 100%); border-radius: 999px; padding: 13px 22px; border: 0;
  background: linear-gradient(rgba(var(--glass), .22), rgba(var(--glass), .22));
  backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(var(--glass), .3), 0 14px 56px -20px rgba(94, 143, 208, .55), 0 0 30px -12px rgba(232, 146, 90, .4); transition: box-shadow .3s, background .3s; }
.q::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; transition: opacity .3s;
  background: linear-gradient(100deg, rgba(232, 184, 74, .75), rgba(224, 112, 112, .6) 35%, rgba(94, 143, 208, .75) 65%, rgba(143, 199, 154, .7));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .8; }
.q:focus-within { background: linear-gradient(rgba(var(--glass), .34), rgba(var(--glass), .34)); box-shadow: inset 0 1px 0 rgba(var(--glass), .4), 0 0 0 4px var(--wash), 0 16px 64px -16px rgba(94, 143, 208, .7), 0 0 40px -10px rgba(232, 146, 90, .5); }
.q:focus-within::before { opacity: 1; }
.q input::placeholder { color: var(--faint); opacity: .85; }
.q .go { font: 11px var(--mono); color: var(--faint); border: 1px solid transparent; border-radius: 6px; padding: 1px 7px; background: rgba(var(--glass), .25); }
.q input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: 16px var(--sans); }
.q svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
.hint { font: 12px var(--mono); color: var(--muted); min-height: 18px; text-align: center; overflow-wrap: anywhere; max-width: 100%; }
.hint b { color: var(--accent-hi); font-weight: 500; }
input:focus-visible { outline: none; }

/* работающий мозг: импульсы бегут по извилинам и дорожкам, нейроны вспыхивают, на стыке искры */
.brain { animation: breathe 4.6s ease-in-out infinite; transform-origin: 50% 50%; }
@keyframes breathe { 50% { transform: scale(1.03); } }
.sig { fill: none; stroke-linecap: round; stroke-dasharray: .17 1; stroke-dashoffset: .17; opacity: 0; animation: sig calc(var(--d, 2.6s) * var(--k, 1)) linear infinite; animation-delay: var(--dl, 0s); }
.sigL { stroke: #fff2c8; stroke-width: 1.5; filter: drop-shadow(0 0 1.3px #ffc25a); }

@keyframes sig { 0% { stroke-dashoffset: .17; opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { stroke-dashoffset: -1; opacity: 0; } }
.neu, .rip, .spark { transform-box: fill-box; transform-origin: center; animation-delay: var(--dl, 0s); }
.neu { fill: #fff0bd; filter: drop-shadow(0 0 2px #ffb84a); animation: fire calc(2.4s * var(--k, 1)) ease-in-out infinite; }
.rip { fill: none; stroke: #ffd27a; stroke-width: .45; opacity: 0; animation: ripple calc(2.4s * var(--k, 1)) ease-out infinite; }
.spark { fill: #fff; filter: drop-shadow(0 0 2px #8fd8ff); opacity: 0; animation: spark calc(2.1s * var(--k, 1)) ease-in-out infinite; }
@keyframes fire { 0%, 100% { transform: scale(.7); opacity: .35; } 18% { transform: scale(1.6); opacity: 1; } 45% { transform: scale(1); opacity: .55; } }
@keyframes ripple { 0% { transform: scale(1); opacity: .9; } 70%, 100% { transform: scale(5); opacity: 0; } }
@keyframes spark { 0%, 70%, 100% { opacity: 0; transform: scale(.5); } 82% { opacity: 1; transform: scale(2.2); } }
.typing .brain { --k: .42; }
.typing .sig { stroke-width: 1.9; }
@media (max-width: 640px) { .word { font-size: 30px; } .page { min-height: 560px; } .sun { width: 118px; height: 118px; } .brain { width: 100px; height: 100px; } }
@media (prefers-reduced-motion: reduce) { .word, .typing .gyri, .cutf circle, .brain, .sig, .neu, .rip, .spark { animation: none; } .sig { opacity: 0; } .lobe-l, .lobe-r { transition: none; } }

/* экономный режим: без действий анимация замирает, и вкладка не шлет кадры и не греет процессор */
.calm *, .calm *::before, .calm *::after { animation-play-state: paused !important; }

<script id="route">
const SEARCH = "https://www.google.com/search?q=";
// route: что делать с введенным. Адрес открывается, слова уходят в поиск, опасные схемы закрыты.
function route(raw) {
  const t = String(raw).trim();
  if (!t) return { kind: "none" };
  if (/^(javascript|data|file|chrome|chrome-extension|about|blob|view-source|vbscript|brave|edge|filesystem|ftp|ws|wss):/i.test(t)) return { kind: "refused" };
  if (/^https?:\/\//i.test(t)) { try { return { kind: "open", url: new URL(t).href }; } catch (e) { return { kind: "search", url: SEARCH + encodeURIComponent(t) }; } }
  if (!/\s/.test(t) && /^(localhost|(\d{1,3}\.){3}\d{1,3}|([\p{L}\p{N}-]+\.)+\p{L}{2,})(:\d+)?([/?#]\S*)?$/iu.test(t)) {
    const local = /^(localhost|\d{1,3}(\.\d{1,3}){3})(:|\/|$)/i.test(t);
    try { return { kind: "open", url: new URL((local ? "http://" : "https://") + t).href }; } catch (e) { /* ниже поиск */ }
  }
  return { kind: "search", url: SEARCH + encodeURIComponent(t) };
}
</script>
