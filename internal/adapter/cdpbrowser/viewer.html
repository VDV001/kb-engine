<!doctype html>
<meta charset="utf-8">
<title>Браузер</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #c4c4c6; font: 13px ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 6px; padding: 6px; border-bottom: 1px solid #222; }
  #bar button { background: #16171a; color: inherit; border: 1px solid #2a2b2f; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:hover { border-color: #4a4b50; }
  #addr { flex: 1; background: #101113; color: inherit; border: 1px solid #2a2b2f; border-radius: 6px; padding: 4px 10px; font: inherit; }
  #stage { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; background: #fff; }}px; height: auto; align-self: flex-start; cursor: default; background: #fff; }
  #kb { position: fixed; left: -999px; top: 0; width: 1px; height: 1px; opacity: 0; }
  #addr.plain { color: #e0a458; }
  #msg { padding: 4px 8px; color: #e0a458; }
</style>
<div id="bar">
  <button id="back" title="Назад" aria-label="Назад">←</button>
  <button id="fwd" title="Вперед" aria-label="Вперед">→</button>
  <button id="rel" title="Обновить" aria-label="Обновить">↻</button>
  <input id="addr" placeholder="Адрес: https://…" autocomplete="off" spellcheck="false">
</div>
<div id="msg" hidden></div>
<div id="stage"><canvas id="c" width="{{W}}" height="{{H}}"></canvas></div>
<textarea id="kb" aria-label="Ввод в браузер"></textarea>
<script>
let W = {{W}}, H = {{H}}; // подгоняются под вкладку: экран браузера занимает все окно
const c = document.getElementById("c"), x = c.getContext("2d"), kb = document.getElementById("kb"), msg = document.getElementById("msg"), addr = document.getElementById("addr");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const say = (t) => { msg.hidden = !t; msg.textContent = t || ""; };
const clamp = (v, hi) => Math.max(0, Math.min(hi, v));
// Адреса относительные: окно открывает страницу под своим префиксом, и абсолютный путь ушел бы мимо прокси.
// Ввод идет одной очередью: параллельные запросы доходили бы до браузера вразнобой (буквы, Enter раньше текста).
let chain = Promise.resolve(), moving = false;
function send(ev) {
  const run = async () => {
    try {
      const r = await fetch("input", { method: "POST", headers: { "Content-Type": "application/json", "X-DVK-App": "1" }, body: JSON.stringify(ev) });
      if (!r.ok) { const t = (await r.text()).trim().slice(0, 200); say(r.status >= 500 ? t : "Ввод не принят: " + t); } else say("");
    } catch (e) { say("Браузер не отвечает"); }
  };
  chain = chain.then(run);
  return chain;
}
let seq = 0, epoch = "";
(async function frames() {
  for (;;) {
    try {
      const r = await fetch("frame?after=" + seq, { cache: "no-store" });
      const e = r.headers.get("X-Frame-Epoch");
      if (e && e !== epoch) { epoch = e; seq = 0; if (r.status === 204) continue; } // сервер перезапущен: номера кадров с единицы
      if (r.status === 200) {
        seq = +r.headers.get("X-Frame-Seq");
        const u = r.headers.get("X-Frame-URL");
        if (u !== null && document.activeElement !== addr) { try { addr.value = decodeURIComponent(u); } catch (_) { addr.value = u; } addr.classList.toggle("plain", addr.value.startsWith("http:")); }
        const bmp = await createImageBitmap(await r.blob());
        x.drawImage(bmp, 0, 0, W, H); bmp.close(); say("");
      } else if (r.status !== 204) { say((await r.text()).trim().slice(0, 200)); await sleep(1500); }
    } catch (e) { say("Браузер не отвечает"); await sleep(1500); }
  }
})();
const stage = document.getElementById("stage");
let sent = "";
function fit() {
  const r = stage.getBoundingClientRect();
  const w = Math.round(Math.max(320, Math.min(3840, r.width))), h = Math.round(Math.max(240, Math.min(2400, r.height)));
  if (w === W && h === H && sent) return;
  W = w; H = h; c.width = w; c.height = h;
  if (sent !== w + "x" + h) { sent = w + "x" + h; send({ t: "resize", x: w, y: h }); }
}
let fitTimer = 0;
new ResizeObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 150); }).observe(stage);
fit();
const pos = (e) => { const r = c.getBoundingClientRect(); return { x: clamp((e.clientX - r.left) * W / r.width, W), y: clamp((e.clientY - r.top) * H / r.height, H) }; };
let lastMove = 0, down = false;
c.addEventListener("mousedown", (e) => { down = true; send({ t: "mouse", type: "pressed", ...pos(e) }); kb.focus(); e.preventDefault(); });
// Кнопку могут отпустить вне холста: отпускание слушаем на окне, иначе браузер считал бы кнопку зажатой.
window.addEventListener("mouseup", (e) => { if (down) { down = false; send({ t: "mouse", type: "released", ...pos(e) }); } });
c.addEventListener("mousemove", (e) => { const n = Date.now(); if (!moving && n - lastMove > 50) { lastMove = n; moving = true; send({ t: "mouse", type: "moved", ...pos(e) }).then(() => { moving = false; }); } });
c.addEventListener("wheel", (e) => { e.preventDefault(); send({ t: "wheel", dx: e.deltaX, dy: e.deltaY, ...pos(e) }); }, { passive: false });
// Текст — из скрытого поля: так приходят и обычные буквы, и кириллица с IME, и вставка Cmd+V.
kb.addEventListener("input", (e) => { if (!e.isComposing && kb.value) { send({ t: "text", text: kb.value }); kb.value = ""; } });
kb.addEventListener("compositionend", () => { if (kb.value) { send({ t: "text", text: kb.value }); kb.value = ""; } });
const NAMED = new Set(["Enter", "Backspace", "Tab", "Escape", "Delete", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"]);
kb.addEventListener("keydown", (e) => { if (!e.isComposing && !e.metaKey && !e.ctrlKey && NAMED.has(e.key)) { send({ t: "key", key: e.key }); e.preventDefault(); } });
const nav = (text) => send({ t: "nav", text });
document.getElementById("back").onclick = () => nav("back");
document.getElementById("fwd").onclick = () => nav("forward");
document.getElementById("rel").onclick = () => nav("reload");
addr.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  let v = addr.value.trim();
  if (v && !/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v; // «localhost:3000» схемой не считается
  if (v) { nav(v); addr.blur(); }
});
</script>
